<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <!-- Background -->
  <rect width="280" height="80" fill="#0a0a0a" rx="8"/>

  <!-- Waveform icon bars -->
  <g fill="#ffffff">
    <!-- Bar 1 -->
    <rect x="18" y="32" width="5" height="16" rx="2.5"/>
    <!-- Bar 2 -->
    <rect x="27" y="22" width="5" height="36" rx="2.5"/>
    <!-- Bar 3 -->
    <rect x="36" y="14" width="5" height="52" rx="2.5"/>
    <!-- Bar 4 -->
    <rect x="45" y="22" width="5" height="36" rx="2.5"/>
    <!-- Bar 5 -->
    <rect x="54" y="30" width="5" height="20" rx="2.5"/>
    <!-- Bar 6 -->
    <rect x="63" y="25" width="5" height="30" rx="2.5"/>
    <!-- Bar 7 -->
    <rect x="72" y="34" width="5" height="12" rx="2.5"/>
  </g>

  <!-- Divider line -->
  <rect x="92" y="15" width="1" height="50" fill="#333333"/>

  <!-- NOIR text -->
  <text x="106" y="46"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="28"
    font-weight="900"
    letter-spacing="6"
    fill="#ffffff">NOIR</text>

  <!-- AUDIO text -->
  <text x="107" y="62"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11"
    font-weight="300"
    letter-spacing="8"
    fill="#888888">AUDIO</text>
</svg>
